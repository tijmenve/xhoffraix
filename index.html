<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xhoffraix Trip - Oct 15–23, 2026</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.5;
            color: #333;
        }
        
        header {
            background: #2c5282;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        
        header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        
        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .controls {
            padding: 1rem;
            background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .search-box {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }
        
        .filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            flex: 1;
            min-width: 80px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 500;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn.active {
            background: #2c5282;
            color: white;
            border-color: #2c5282;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
        }
        
        #map {
            width: 100%;
            height: 40vh;
            min-height: 300px;
        }
        
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }
        
        .activity-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .activity-card:hover {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .activity-card.hidden {
            display: none;
        }
        
        .activity-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: #2c5282;
            margin-bottom: 0.5rem;
        }
        
        .activity-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 0.5rem;
        }
        
        .activity-meta span {
            display: inline-flex;
            align-items: center;
        }
        
        .activity-notes {
            font-size: 0.9rem;
            color: #4a5568;
            line-height: 1.6;
        }
        
        .activity-link {
            display: inline-block;
            margin-top: 0.5rem;
            color: #2c5282;
            text-decoration: none;
            font-weight: 500;
        }
        
        .activity-link:hover {
            text-decoration: underline;
        }
        
        .category-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: #edf2f7;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 0.5rem;
        }
        
        .category-badge.family {
            background: #bee3f8;
            color: #2c5282;
        }
        
        .category-badge.ww2 {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .category-badge.bakeries {
            background: #fef3c7;
            color: #78350f;
        }
        
        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
            
            #map {
                width: 50%;
                height: calc(100vh - 180px);
            }
            
            .list-container {
                width: 50%;
            }
            
            header h1 {
                font-size: 2rem;
            }
        }
        
        .leaflet-popup-content {
            margin: 0.75rem;
        }
        
        .popup-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: #2c5282;
        }
        
        .popup-meta {
            font-size: 0.85rem;
            color: #4a5568;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <h1>Xhoffraix Trip</h1>
    </header>
    
    <div class="controls">
        <input type="text" class="search-box" placeholder="Search activities..." id="searchBox">
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="family">Family</button>
            <button class="filter-btn" data-filter="ww2">World War II</button>
            <button class="filter-btn" data-filter="bakeries">Bakeries</button>
        </div>
    </div>
    
    <div class="container">
        <div id="map"></div>
        <div class="list-container" id="activityList"></div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let activities = [];
        
        // Load activities from JSON file
        fetch('activities.json')
            .then(response => response.json())
            .then(data => {
                activities = data;
                initializeMap();
            })
            .catch(error => {
                console.error('Error loading activities:', error);
                document.getElementById('activityList').innerHTML = '<p style="padding: 1rem; color: red;">Error loading activities. Please refresh the page.</p>';
            });
        
        function initializeMap() {
        // Initialize map centered on Xhoffraix
        const map = L.map('map').setView([50.4569766, 6.0709928], 11);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Add markers for activities with coordinates
        const markers = {};
        activities.forEach(activity => {
            if (activity.lat && activity.lng) {
                const marker = L.marker([activity.lat, activity.lng]).addTo(map);
                
                const popupContent = `
                    <div class="popup-name">${activity.name}</div>
                    <div class="popup-meta">
                        <strong>Distance:</strong> ${activity.distance}<br>
                        <strong>Price:</strong> ${activity.price}<br>
                        <strong>Hours:</strong> ${activity.hours}
                        ${activity.url ? `<br><br><a href="${activity.url}" target="_blank">Visit website</a>` : ''}
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                markers[activity.id] = marker;
                
                marker.on('click', function() {
                    window.location.hash = `activity-${activity.id}`;
                    // Scroll to activity card
                    const card = document.querySelector(`[data-id="${activity.id}"]`);
                    if (card) {
                        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                });
            }
        });
        
        // Add Xhoffraix reference marker
        const homeIcon = L.divIcon({
            html: '<div style="background: #e53e3e; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white;"></div>',
            className: '',
            iconSize: [12, 12]
        });
        L.marker([50.4569766, 6.0709928], { icon: homeIcon })
            .addTo(map)
            .bindPopup('<div class="popup-name">Xhoffraix</div>');
        
        // Render activity list
        function renderActivities() {
            const listContainer = document.getElementById('activityList');
            listContainer.innerHTML = '';
            
            activities.forEach(activity => {
                const card = document.createElement('div');
                card.className = 'activity-card';
                card.dataset.id = activity.id;
                card.dataset.category = activity.category;
                
                // Create Google Maps link
                const mapsUrl = activity.lat && activity.lng 
                    ? `https://www.google.com/maps/dir/?api=1&destination=${activity.lat},${activity.lng}`
                    : `https://www.google.com/maps/search/${encodeURIComponent(activity.address)}`;
                
                // Get category display name
                let categoryDisplay = 'Family';
                if (activity.category === 'ww2') categoryDisplay = 'World War II';
                if (activity.category === 'bakeries') categoryDisplay = 'Bakeries';
                
                card.innerHTML = `
                    <div class="category-badge ${activity.category}">${categoryDisplay}</div>
                    <div class="activity-name">${activity.name}</div>
                    <div class="activity-meta">
                        <span>📍 ${activity.distance}</span>
                        <span>💰 ${activity.price}</span>
                    </div>
                    <div class="activity-notes">
                        <strong>Address:</strong> <a href="${mapsUrl}" target="_blank" style="color: #2c5282;">${activity.address}</a><br>
                        <strong>Hours:</strong> ${activity.hours}<br>
                        ${activity.notes ? activity.notes : ''}
                    </div>
                    ${activity.url ? `<a href="${activity.url}" target="_blank" class="activity-link">Visit website →</a>` : ''}
                `;
                
                card.addEventListener('click', function(e) {
                    if (!e.target.matches('a')) {
                        window.location.hash = `activity-${activity.id}`;
                        if (markers[activity.id]) {
                            map.setView([activity.lat, activity.lng], 13);
                            markers[activity.id].openPopup();
                        }
                    }
                });
                
                listContainer.appendChild(card);
            });
        }
        
        // Filter functionality
        let currentFilter = 'all';
        let currentSearch = '';
        
        function applyFilters() {
            const cards = document.querySelectorAll('.activity-card');
            cards.forEach(card => {
                const category = card.dataset.category;
                const text = card.textContent.toLowerCase();
                
                const categoryMatch = currentFilter === 'all' || category === currentFilter;
                const searchMatch = currentSearch === '' || text.includes(currentSearch.toLowerCase());
                
                if (categoryMatch && searchMatch) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
            
            // Filter map markers and collect visible ones
            const visibleMarkers = [];
            activities.forEach(activity => {
                const marker = markers[activity.id];
                if (marker) {
                    const activityText = `${activity.name} ${activity.notes} ${activity.distance} ${activity.price} ${activity.hours}`.toLowerCase();
                    const categoryMatch = currentFilter === 'all' || activity.category === currentFilter;
                    const searchMatch = currentSearch === '' || activityText.includes(currentSearch.toLowerCase());
                    
                    if (categoryMatch && searchMatch) {
                        map.addLayer(marker);
                        visibleMarkers.push(marker);
                    } else {
                        map.removeLayer(marker);
                    }
                }
            });
            
            // Auto-fit map to visible markers
            if (visibleMarkers.length > 1) {
                // Multiple markers: fit bounds with padding
                const group = L.featureGroup(visibleMarkers);
                map.fitBounds(group.getBounds(), { padding: [50, 50] });
            } else if (visibleMarkers.length === 1) {
                // Single marker: center with sensible zoom
                const marker = visibleMarkers[0];
                const latLng = marker.getLatLng();
                map.setView(latLng, 13);
            }
            // If no markers visible, leave map as-is
        }
        
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                applyFilters();
            });
        });
        
        // Search box
        document.getElementById('searchBox').addEventListener('input', function(e) {
            currentSearch = e.target.value;
            applyFilters();
        });
        
        // Initial render
        renderActivities();
        
        // Handle URL hash for sharing specific activities
        function handleHash() {
            const hash = window.location.hash;
            if (hash.startsWith('#activity-')) {
                const activityId = parseInt(hash.replace('#activity-', ''));
                const activity = activities.find(a => a.id === activityId);
                if (activity) {
                    const card = document.querySelector(`[data-id="${activityId}"]`);
                    if (card && !card.classList.contains('hidden')) {
                        setTimeout(() => {
                            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            if (markers[activityId]) {
                                map.setView([activity.lat, activity.lng], 13);
                                markers[activityId].openPopup();
                            }
                        }, 100);
                    }
                }
            }
        }
        
        // Handle hash on page load and hash changes
        window.addEventListener('hashchange', handleHash);
        handleHash();
        
        // Note about drive times
        const note = document.createElement('div');
        note.style.cssText = 'padding: 1rem; background: #fffaf0; border-top: 1px solid #fed7aa; font-size: 0.85rem; color: #744210; text-align: center;';
        note.textContent = 'Drive times are no-traffic estimates from Xhoffraix (50.4569766 N, 6.0709928 E), fetched 3 October 2026, not live traffic.';
        document.body.appendChild(note);
        
        } // End initializeMap
    </script>
</body>
</html>
